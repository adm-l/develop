name: CI Pipeline

on:
  pull_request:
    branches:
      - dev
      - feature_1

  push:
    branches:
      - '*'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-scan:

    runs-on: ubuntu-latest

    timeout-minutes: 15

    permissions:
      contents: read
      security-events: write

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Docker Image
        env:
          DOCKER_BUILDKIT: 1
        run: |
          docker build -t hello-api:${{ github.sha }} .

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: hello-api:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: 0

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/hello-api:${{ github.sha }}