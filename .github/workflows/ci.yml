name: CI Pipeline

on:
  pull_request:
    branches:
      - dev

jobs:
  ci:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/hello-api
      TAG: ${{ github.sha }}

    steps:

      # 1. Checkout SOURCE branch (important fix)
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      # 2. Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install deps
      - name: Install Dependencies
        run: npm ci

      # 4. Build Docker image
      - name: Build Docker Image
        env:
          DOCKER_BUILDKIT: 1
        run: |
          docker build \
            -t $IMAGE_NAME:$TAG \
            -t $IMAGE_NAME:dev .

      # 5. Trivy scan
      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.TAG }}
          severity: HIGH,CRITICAL
          exit-code: 0

      # 6. Docker login
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 7. Push image
      - name: Push Image
        run: |
          docker push $IMAGE_NAME:$TAG
          docker push $IMAGE_NAME:dev

      # 8. Update Helm chart (YOUR REQUIREMENT)
      - name: Update Helm values
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          FILE="hello-api-chart/values.yaml"

          sed -i "s/tag:.*/tag: $TAG/g" $FILE

          git add $FILE
          git commit -m "ci: update image tag $TAG" || echo "No changes"

          # IMPORTANT: push back to feature branch (not detached HEAD)
          git push origin HEAD:${{ github.head_ref }}